<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendly 家計簿</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#6b7686;
    --line:#e5e8ee; --accent:#2563eb; --accent-ink:#ffffff;
    --in:#0a7d4f; --out:#c2410c; --danger:#b91c1c;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:14px 16px 8px; border-bottom:1px solid var(--line);
  }
  h1{font-size:20px; margin:0 0 8px}
  .monthbar{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .monthbar .label{font-size:18px; font-weight:700}
  button{
    font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:8px 14px; cursor:pointer; min-height:44px;
  }
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
  button.danger{color:var(--danger); border-color:#f0c9c9}
  button:active{opacity:.75}
  main{padding:12px 16px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
  .card h2{font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:700}
  .summary{display:flex; gap:8px; text-align:center}
  .summary>div{flex:1}
  .summary .k{font-size:12px; color:var(--muted)}
  .summary .v{font-size:19px; font-weight:800; margin-top:2px}
  .v.in{color:var(--in)} .v.out{color:var(--out)}
  .cat-row{margin:8px 0}
  .cat-row .top{display:flex; justify-content:space-between; font-size:14px}
  .cat-row .top .amt{font-weight:700}
  .bar{height:8px; background:var(--line); border-radius:99px; margin-top:4px; overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .item{
    display:flex; align-items:center; gap:10px; padding:11px 2px;
    border-bottom:1px solid var(--line); cursor:pointer; min-height:56px;
  }
  .item:last-child{border-bottom:none}
  .item .main{flex:1; min-width:0}
  .item .title{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .item .sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .item .amount{font-weight:800; white-space:nowrap}
  .item .amount.in{color:var(--in)} .item .amount.out{color:var(--out)}
  .badge{
    font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line);
    color:var(--muted); white-space:nowrap;
  }
  .badge.veda{color:#6d28d9; border-color:#ddd0f7; background:#f5f0ff}
  .badge.pending{color:#9a6a00; border-color:#f0dfae; background:#fff8e1}
  .empty{color:var(--muted); text-align:center; padding:18px 0}
  .field{margin:10px 0}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
  .field input,.field select,.field textarea{
    width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; min-height:48px;
  }
  .field textarea{min-height:64px; resize:vertical}
  .secret-row{display:flex; gap:8px; align-items:stretch}
  .secret-row input{flex:1}
  .secret-row button{min-height:48px; white-space:nowrap}
  .sync-status{color:var(--muted); font-size:0.85rem; line-height:1.45; margin:8px 0 0; word-break:break-word}
  .btn-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .note{font-size:13px; color:var(--muted)}
  dialog{
    border:none; border-radius:16px; padding:0; width:min(94vw,480px);
    max-height:88vh; overflow:auto;
  }
  dialog::backdrop{background:rgba(20,26,38,.45)}
  .dlg-body{padding:18px}
  .dlg-body h2{margin:0 0 6px; font-size:17px}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{flex:1; border:none; border-radius:0; background:#fff; min-height:48px}
  .seg button.on{background:var(--accent); color:#fff; font-weight:700}
  #toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#1c2430; color:#fff; padding:10px 18px; border-radius:99px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; max-width:92vw; text-align:center;
  }
  #toast.show{opacity:1}
</style>
<script src="sync.js"></script>
</head>
<body>
<header>
  <h1>💰 Spendly 家計簿</h1>
  <div class="monthbar">
    <button id="prevMonth" aria-label="前の月">‹ 前月</button>
    <div class="label" id="monthLabel">----年--月</div>
    <button id="nextMonth" aria-label="次の月">次月 ›</button>
  </div>
</header>
<main>
  <section class="card">
    <div class="summary">
      <div><div class="k">収入</div><div class="v in" id="sumIn">¥0</div></div>
      <div><div class="k">支出</div><div class="v out" id="sumOut">¥0</div></div>
      <div><div class="k">収支</div><div class="v" id="sumNet">¥0</div></div>
    </div>
  </section>

  <section class="card">
    <h2>カテゴリ別（支出）</h2>
    <div id="catBars"><div class="empty">この月の支出はまだありません</div></div>
  </section>

  <button class="primary" id="addBtn">＋ 記録を追加</button>

  <section class="card">
    <h2>記録一覧</h2>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </section>

  <section class="card">
    <h2>スプレッドシート連携</h2>
    <p class="note">正本はGoogleスプレッドシート「Spendly家計簿」です。アプリは開くたびにシートを読み直します。アプリでの追加・編集・削除はキューに積まれ、送信できるときにシートへ送られます。URLと合言葉は、この端末の中だけに保存されます。</p>
    <div class="field">
      <label for="syncUrl">送信先URL（Apps ScriptのウェブアプリURL）</label>
      <input id="syncUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="field">
      <label for="syncToken">合言葉</label>
      <div class="secret-row">
        <input id="syncToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="合言葉">
        <button type="button" id="syncTokenToggle" aria-label="合言葉を表示">表示</button>
      </div>
    </div>
    <p class="sync-status" id="syncStatus"></p>
    <div class="btn-row">
      <button type="button" id="syncTest">接続テスト</button>
      <button type="button" id="syncPull">シートから読み直す</button>
      <button type="button" id="syncAll">全データを送り直す</button>
    </div>
  </section>

  <section class="card">
    <h2>データ管理</h2>
    <div class="btn-row">
      <button type="button" id="exportBtn">書き出す（JSON）</button>
      <button type="button" id="importBtn">読み込む（JSON）</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="note">読み込みはIDで照合し、取り込んだ記録をシートへ送るキューに積みます（既存の記録は消えません）。</p>
  </section>
</main>

<dialog id="editDlg">
  <form method="dialog" class="dlg-body" id="editForm">
    <h2 id="dlgTitle">記録を追加</h2>
    <div class="field">
      <div class="seg" role="tablist" aria-label="種別">
        <button type="button" id="segOut" class="on">支出</button>
        <button type="button" id="segIn">収入</button>
      </div>
    </div>
    <div class="field">
      <label for="fDate">日付</label>
      <input type="date" id="fDate" required>
    </div>
    <div class="field">
      <label for="fTitle">内容（店名・用途）</label>
      <input type="text" id="fTitle" maxlength="200" placeholder="例：業務スーパー草薙店" required>
    </div>
    <div class="field">
      <label for="fAmount">金額（円）</label>
      <input type="text" id="fAmount" inputmode="numeric" pattern="[0-9]*" placeholder="0" required>
    </div>
    <div class="field">
      <label for="fCategory">カテゴリ</label>
      <select id="fCategory"></select>
    </div>
    <div class="field">
      <label for="fMemo">メモ</label>
      <textarea id="fMemo" maxlength="200" placeholder="任意"></textarea>
    </div>
    <div class="btn-row">
      <button type="submit" class="primary" id="saveBtn">保存</button>
      <button type="button" id="cancelBtn">キャンセル</button>
      <button type="button" class="danger" id="deleteBtn" hidden>削除</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
